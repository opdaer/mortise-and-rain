import * as THREE from 'three';

const PALETTE = {
  woodLight: new THREE.Color('#5C3A21'),
  woodDark:  new THREE.Color('#3D2616'),
  tileGlaze: new THREE.Color('#2B373D'),
  nightBg:   new THREE.Color('#0F171A'),

const MAX_LAYER = 12;

class AnalyticalSpringLayers {
  constructor(numLayers = MAX_LAYER) {
    this.numLayers = numLayers;
    this.zeta = 0.74;
    this.wn = 7.6;
    this.wd = this.wn * Math.sqrt(1.0 - this.zeta * this.zeta);
    this.staggerSec = 0.035; // 35ms topological layer stagger
    this.target = 0.0;
    this._lastDir = 0;
    this.layers = [];
    for (let i = 0; i <= numLayers; i++) {
      this.layers.push({
        p0: 0.0, v0: 0.0, p1: 0.0,
        tStart: 0.0, delay: 0.0,
        currentP: 0.0, currentV: 0.0,
        audioArmed: false
      });
    }
  }

  evalLayer(L, t) {
    const st = this.layers[L];
    if (L === 0) return { p: 0.0, v: 0.0 };
    const tau = t - (st.tStart + st.delay);
    if (tau <= 0.0) return { p: st.p0, v: st.v0 };
    const d0 = st.p0 - st.p1;
    if (Math.abs(d0) < 1e-6 && Math.abs(st.v0) < 1e-6) return { p: st.p1, v: 0.0 };

    const zwn = this.zeta * this.wn;
    const env = Math.exp(-zwn * tau);
    const c = Math.cos(this.wd * tau);
    const s = Math.sin(this.wd * tau);
    const B = (st.v0 + zwn * d0) / this.wd;

    let p = st.p1 + env * (d0 * c + B * s);
    let v = env * ((B * this.wd - zwn * d0) * c - (d0 * this.wd + zwn * B) * s);
    // Physical mortise shoulder hard-stop: timber seats flush at p = 0.0 without passing through stone/wood below
    if (st.p1 <= 1e-4 && p < 0.0) {
      p = 0.0;
      v = 0.0;
    }
    if (tau > 1.8 && Math.abs(p - st.p1) < 1e-4 && Math.abs(v) < 1e-4) {
      p = st.p1;
      v = 0.0;
    }
    return { p, v };
  }

  setTarget(newTarget, nowSec, useStagger = true, instant = false) {
    const clamped = Math.max(0.0, Math.min(1.0, newTarget));
    const deltaTarget = clamped - this.target;
    if (!instant && Math.abs(deltaTarget) < 1e-6) return;

    const expanding = Math.abs(deltaTarget) > 1e-6 ? (deltaTarget > 0) : (clamped >= 0.5);
    const newDir = expanding ? 1 : -1;
    const dirChanged = (this._lastDir !== 0) && (newDir !== this._lastDir) && Math.abs(deltaTarget) > 0.004;
    this._lastDir = instant ? 0 : newDir;
    this.target = clamped;

    for (let L = 1; L <= this.numLayers; L++) {
      const st = this.layers[L];
      if (instant) {
        st.p0 = clamped; st.v0 = 0.0; st.p1 = clamped;
        st.tStart = nowSec; st.delay = 0.0;
        st.currentP = clamped; st.currentV = 0.0;
        st.audioArmed = false;
        continue;
      }

      const cur = this.evalLayer(L, nowSec);
      const orderIndex = expanding ? (this.numLayers - L) : (L - 1);
      const staggerDelay = useStagger ? orderIndex * this.staggerSec : 0.0;
      const scheduledStart = st.tStart + st.delay;
      const isPendingStagger = (nowSec < scheduledStart) && (Math.abs(st.p1 - st.p0) > 1e-5) && !dirChanged;

      if (isPendingStagger) {
        // Preserve scheduled topological stagger start during continuous 60Hz slider scrubbing
        st.p1 = clamped;
      } else if (Math.abs(cur.v) > 0.015 && !dirChanged && nowSec >= scheduledStart) {
        // Layer has already crossed its stagger slot and is moving: continue smoothly with momentum
        st.p0 = cur.p;
        st.v0 = cur.v;
        st.p1 = clamped;
        st.tStart = nowSec;
        st.delay = 0.0;
      } else {
        // Fresh trigger from rest or direction reversal: schedule full 35ms/layer topological cascade
        st.p0 = cur.p;
        st.v0 = cur.v;
        st.p1 = clamped;
        st.tStart = nowSec;
        st.delay = staggerDelay;
        st.audioArmed = useStagger && Math.abs(clamped - cur.p) > 0.08;
      }
    }
  }

  update(nowSec, onLayerKnock = null) {
    let sumP = 0.0;
    let maxErr = 0.0;
    for (let L = 1; L <= this.numLayers; L++) {
      const st = this.layers[L];
      const prevP = st.currentP;
      const res = this.evalLayer(L, nowSec);
      st.currentP = res.p;
      st.currentV = res.v;
      sumP += res.p;
      maxErr = Math.max(maxErr, Math.abs(res.p));

      if (st.audioArmed && onLayerKnock) {
        const tau = nowSec - (st.tStart + st.delay);
        if (st.p1 > st.p0 && tau >= 0.0) {
          st.audioArmed = false;
          onLayerKnock(L, false);
        } else if (st.p1 < st.p0 && Math.abs(res.p - st.p1) < 0.06 && Math.abs(prevP - st.p1) >= 0.06) {
          st.audioArmed = false;
          onLayerKnock(L, true);
        }
      }
    }
    return { avgRatio: sumP / this.numLayers, maxDisplacementRatio: maxErr };
  }
}

class ZenAudioEngine {
  constructor() {
    this.ctx = null;
    this.enabled = false;
    this.masterGain = null;
    this.malletImpulseBuf = null;
    this.pentatonicHz = [261.63, 294.33, 331.13, 392.44, 441.50, 523.25, 588.67, 662.25, 784.88];
    this.noteIdx = 0;
    this.lastKnockStamp = 0;
    this.lastGuqinStamp = 0;
    this.activeKnockVoices = [];
    this.activeGuqinVoices = [];
    this.ksBufferCache = new Map();
  }

  init() {
    if (this.ctx) return;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    this.ctx = new AudioCtx();
    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.value = 0.0;
    this.masterGain.connect(this.ctx.destination);
    this._buildMalletImpulseBuffer();
    this._setupRainAndBambooAmbience();
  }

  _buildMalletImpulseBuffer() {
    const sr = this.ctx.sampleRate;
    const len = Math.max(64, Math.floor(sr * 0.012));
    const buf = this.ctx.createBuffer(1, len, sr);
    const ch = buf.getChannelData(0);
    let seed = 48271;
    for (let i = 0; i < len; i++) {
      seed = (seed * 16807) % 2147483647;
      const n = ((seed - 1) / 1073741823.0) - 1.0;
      const env = Math.exp(-i / (sr * 0.0024)) * Math.sin(Math.PI * Math.min(1.0, i / (sr * 0.0012)));
      ch[i] = n * env * 0.85;
    }
    this.malletImpulseBuf = buf;
  }

  // Sample-accurate fractional-delay Karplus-Strong cedar waveguide (avoids 128-sample Web Audio feedback quantum clamp >375Hz)
  _getKarplusStrongBuffer(f0, isLocking) {
    const qFreq = Math.round(f0 * 0.5) * 2;
    const key = `${qFreq}_${isLocking ? 1 : 0}`;
    let cached = this.ksBufferCache.get(key);
    if (cached) return cached;

    const sr = this.ctx.sampleRate;
    const dur = 0.22;
    const totalLen = Math.floor(sr * dur);
    const buf = this.ctx.createBuffer(1, totalLen, sr);
    const out = buf.getChannelData(0);
    const period = Math.max(8.0, sr / qFreq);
    const delayN = Math.ceil(period) + 2;
    const ring = new Float32Array(delayN);

    let seed = 48271 + qFreq * 13;
    const burstLen = Math.min(totalLen, Math.max(48, Math.floor(sr * 0.009)));
    for (let i = 0; i < burstLen; i++) {
      seed = (seed * 16807) % 2147483647;
      const noise = ((seed - 1) / 1073741823.0) - 1.0;
      const mallet = Math.exp(-i / (sr * 0.0022)) * Math.sin(Math.PI * Math.min(1.0, i / (sr * 0.0011)));
      out[i] = noise * mallet * 0.90;
    }

    const fbBase = isLocking ? 0.962 : 0.948;
    const damp = isLocking ? 0.44 : 0.52;
    let wIdx = 0;
    let lpState = 0.0;
    for (let i = 0; i < totalLen; i++) {
      const rExact = wIdx - period;
      const r0 = ((Math.floor(rExact) % delayN) + delayN) % delayN;
      const r1 = (r0 + 1) % delayN;
      const frac = rExact - Math.floor(rExact);
      const delayed = ring[r0] * (1.0 - frac) + ring[r1] * frac;
      lpState = delayed * (1.0 - damp) + lpState * damp;
      const sample = (i < burstLen ? out[i] : 0.0) + lpState * fbBase;
      ring[wIdx] = sample;
      out[i] = sample * 0.42;
      wIdx = (wIdx + 1) % delayN;
    }

    if (this.ksBufferCache.size > 96) {
      const firstKey = this.ksBufferCache.keys().next().value;
      this.ksBufferCache.delete(firstKey);
    }
    this.ksBufferCache.set(key, buf);
    return buf;
  }

  toggle(initialStepOffset = 2) {
    this.init();
    if (!this.ctx) return false;
    this.enabled = !this.enabled;
    const applyGainAndChime = () => {
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      this.masterGain.gain.cancelScheduledValues(now);
      this.masterGain.gain.setTargetAtTime(this.enabled ? 0.58 : 0.0, now, 0.22);
      if (this.enabled && initialStepOffset !== null) this.playGuqinHarmonic(initialStepOffset, true);
    };
    if (this.ctx.state === 'suspended') {
      this.ctx.resume().then(applyGainAndChime).catch(() => {});
    } else {
      applyGainAndChime();
    }
    return this.enabled;
  }

  ensureUnlockedQuietly() {
    if (this.enabled && this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }

  _setupRainAndBambooAmbience() {
    const ctx = this.ctx;
    const sr = ctx.sampleRate;
    const len = sr * 4;
    const buf = ctx.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++) {
      const data = buf.getChannelData(ch);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      let seed = 104729 + ch * 7919;
      for (let i = 0; i < len; i++) {
        seed = (seed * 16807) % 2147483647;
        const white = ((seed - 1) / 1073741823.0) - 1.0;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.032;
        b6 = white * 0.115926;
      }
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;

    const tileFilter = ctx.createBiquadFilter();
    tileFilter.type = 'bandpass';
    tileFilter.frequency.value = 880;
    tileFilter.Q.value = 0.85;

    const leafFilter = ctx.createBiquadFilter();
    leafFilter.type = 'bandpass';
    leafFilter.frequency.value = 3250;
    leafFilter.Q.value = 1.25;

    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.14;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 620;
    lfo.connect(lfoGain);
    lfoGain.connect(leafFilter.frequency);

    const rainGain = ctx.createGain();
    rainGain.gain.value = 0.36;
    const leafGain = ctx.createGain();
    leafGain.gain.value = 0.18;

    src.connect(tileFilter);
    src.connect(leafFilter);
    tileFilter.connect(rainGain);
    leafFilter.connect(leafGain);
    rainGain.connect(this.masterGain);
    leafGain.connect(this.masterGain);
    src.start();
    lfo.start();

    const scheduleDroplet = () => {
      if (this.enabled && this.ctx && this.ctx.state === 'running') {
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        const baseF = 1650 + Math.random() * 1600;
        osc.type = 'sine';
        osc.frequency.setValueAtTime(baseF * 0.82, now);
        osc.frequency.exponentialRampToValueAtTime(baseF * 1.38, now + 0.038);
        g.gain.setValueAtTime(0.0001, now);
        g.gain.linearRampToValueAtTime(0.024, now + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.065);
        osc.connect(g);
        g.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.07);
      }
      setTimeout(scheduleDroplet, 200 + Math.random() * 520);
    };
    scheduleDroplet();
  }

  playWoodKnock(volumeM3 = 0.012, isLocking = true) {
    if (!this.enabled || !this.ctx || this.ctx.state !== 'running') return;
    const perfNow = performance.now();
    if (perfNow - this.lastKnockStamp < 22) return;
    this.lastKnockStamp = perfNow;

    while (this.activeKnockVoices.length >= 8) {
      const oldest = this.activeKnockVoices.shift();
      try { oldest.disconnect(); } catch (_) {}
    }

    const ctx = this.ctx;
    const now = ctx.currentTime;
    const clampedV = Math.max(0.0008, Math.min(0.25, volumeM3));
    const f0 = Math.max(145, Math.min(880, 152 * Math.pow(clampedV, -0.24))) * (isLocking ? 1.0 : 1.08);

    const voiceBus = ctx.createGain();
    voiceBus.gain.setValueAtTime(0.85, now);
    voiceBus.gain.exponentialRampToValueAtTime(0.0008, now + 0.24);
    voiceBus.connect(this.masterGain);
    this.activeKnockVoices.push(voiceBus);

    // 1. Sample-accurate Karplus-Strong physical waveguide resonator tuned strictly to f0 (145..880 Hz)
    const ksBuf = this._getKarplusStrongBuffer(f0, isLocking);
    if (ksBuf) {
      const ksSrc = ctx.createBufferSource();
      ksSrc.buffer = ksBuf;
      const ksBody = ctx.createBiquadFilter();
      ksBody.type = 'bandpass';
      ksBody.frequency.setValueAtTime(f0 * 1.15, now);
      ksBody.Q.value = 1.15;
      ksSrc.connect(ksBody);
      ksBody.connect(voiceBus);
      ksSrc.start(now);
    }

    // 2. Orthotropic free-bar modal woodblock partials (1 : 2.756 : 5.404)
    const modes = [1.0, 2.756, 5.404];
    const gains = [0.16, 0.082, 0.030];
    const decays = [0.13, 0.055, 0.025];

    modes.forEach((ratio, idx) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = idx === 0 ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(f0 * ratio * 1.03, now);
      osc.frequency.exponentialRampToValueAtTime(f0 * ratio, now + 0.022);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.linearRampToValueAtTime(gains[idx], now + 0.0025);
      g.gain.exponentialRampToValueAtTime(0.0001, now + decays[idx]);
      osc.connect(g);
      g.connect(voiceBus);
      osc.start(now);
      osc.stop(now + decays[idx] + 0.02);
      if (idx === 0) {
        osc.onended = () => {
          const pos = this.activeKnockVoices.indexOf(voiceBus);
          if (pos !== -1) this.activeKnockVoices.splice(pos, 1);
          try { voiceBus.disconnect(); } catch (_) {}
        };
      }
    });
  }

  playGuqinHarmonic(stepOffset = null, bypassStateGuard = false) {
    if (!this.enabled || !this.ctx) return;
    if (!bypassStateGuard && this.ctx.state !== 'running') {
      this.ctx.resume().then(() => this.playGuqinHarmonic(stepOffset, true)).catch(() => {});
      return;
    }
    const perfNow = performance.now();
    if (perfNow - this.lastGuqinStamp < 45) return;
    this.lastGuqinStamp = perfNow;

    while (this.activeGuqinVoices.length >= 5) {
      const oldest = this.activeGuqinVoices.shift();
      try { oldest.disconnect(); } catch (_) {}
    }

    const ctx = this.ctx;
    const now = ctx.currentTime;
    const idx = stepOffset !== null ? (stepOffset % this.pentatonicHz.length) : (this.noteIdx++ % this.pentatonicHz.length);
    const freq = this.pentatonicHz[idx];
    const partials = [1.0, 2.0, 3.002, 4.005];
    const amps = [0.15, 0.11, 0.055, 0.022];
    const durs = [3.2, 2.4, 1.6, 1.0];

    const body = ctx.createBiquadFilter();
    body.type = 'peaking';
    body.frequency.value = 220;
    body.Q.value = 1.4;
    body.gain.value = 4.5;
    body.connect(this.masterGain);
    this.activeGuqinVoices.push(body);

    partials.forEach((p, i) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq * p, now);
      osc.frequency.linearRampToValueAtTime(freq * p * 1.0035, now + 0.35);
      osc.frequency.linearRampToValueAtTime(freq * p, now + 0.85);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.linearRampToValueAtTime(amps[i], now + 0.014);
      g.gain.exponentialRampToValueAtTime(0.0001, now + durs[i]);
      osc.connect(g);
      g.connect(body);
      osc.start(now);
      osc.stop(now + durs[i] + 0.05);
      if (i === 0) {
        osc.onended = () => {
          const pos = this.activeGuqinVoices.indexOf(body);
          if (pos !== -1) this.activeGuqinVoices.splice(pos, 1);
          try { body.disconnect(); } catch (_) {}
        };
      }
    });
  }
}

// Inject Percentage-Closer Soft Shadows (PCSS: IGN-rotated Vogel-disk blocker search + contact-hardening penumbra)
{
  const chunk = THREE.ShaderChunk.shadowmap_pars_fragment;
  const sig = 'float getShadow( sampler2D shadowMap, vec2 shadowMapSize, float shadowBias, float shadowRadius, vec4 shadowCoord ) {';
  const startIdx = chunk.indexOf(sig);
  if (startIdx !== -1) {
    let depth = 0;
    let endIdx = -1;
    for (let i = startIdx + sig.length - 1; i < chunk.length; i++) {
      if (chunk[i] === '{') depth++;
      else if (chunk[i] === '}') {
        depth--;
        if (depth === 0) { endIdx = i; break; }
      }
    }
    if (endIdx !== -1) {
      const pcssFn = `float getShadow( sampler2D shadowMap, vec2 shadowMapSize, float shadowBias, float shadowRadius, vec4 shadowCoord ) {
        shadowCoord.xyz /= shadowCoord.w;
        shadowCoord.z += shadowBias;
        float inFrustum = step( 0.0, shadowCoord.x ) * step( shadowCoord.x, 1.0 )
                        * step( 0.0, shadowCoord.y ) * step( shadowCoord.y, 1.0 )
                        * step( 0.0, shadowCoord.z ) * step( shadowCoord.z, 1.0 );
        vec2 texel = vec2( 1.0 ) / shadowMapSize;
        float ign = fract( 52.9829189 * fract( dot( gl_FragCoord.xy, vec2( 0.06711056, 0.00583715 ) ) ) ) * 6.2831853;
        float ca = cos( ign );
        float sa = sin( ign );
        mat2 rot = mat2( ca, -sa, sa, ca );
        float searchR = 7.5 * shadowRadius;
        float blockerSum = 0.0;
        float blockerCount = 0.0;
        for ( int i = 0; i < 8; i ++ ) {
          float fi = float( i );
          float r = sqrt( ( fi + 0.5 ) / 8.0 ) * searchR;
          float theta = fi * 2.3999632;
          vec2 uvOff = clamp( shadowCoord.xy + ( rot * vec2( cos( theta ), sin( theta ) ) ) * texel * r, 0.001, 0.999 );
          float d = unpackRGBAToDepth( texture2D( shadowMap, uvOff ) );
          float isBlocker = step( d, shadowCoord.z - 0.0001 );
          blockerSum += d * isBlocker;
          blockerCount += isBlocker;
        }
        float avgBlocker = blockerSum / max( blockerCount, 1.0 );
        float penumbra = clamp( ( shadowCoord.z - avgBlocker ) / max( avgBlocker, 0.025 ) * 28.0, 0.95, 6.80 ) * shadowRadius;
        float shadowSum = 0.0;
        for ( int i = 0; i < 12; i ++ ) {
          float fi = float( i );
          float r = sqrt( ( fi + 0.5 ) / 12.0 ) * penumbra;
          float theta = fi * 2.3999632 + 1.0472;
          vec2 uvOff = clamp( shadowCoord.xy + ( rot * vec2( cos( theta ), sin( theta ) ) ) * texel * r, 0.001, 0.999 );
          shadowSum += texture2DCompare( shadowMap, uvOff, shadowCoord.z );
        }
        float litVal = mix( 1.0, shadowSum / 12.0, step( 0.5, blockerCount ) );
        return mix( 1.0, litVal, inFrustum );
      }`;
      THREE.ShaderChunk.shadowmap_pars_fragment = chunk.slice(0, startIdx) + pcssFn + chunk.slice(endIdx + 1);
    }
  }
}

const GLSL_NOISE_LIB = `
  float hash13(vec3 p3) {
    p3 = fract(p3 * 0.1031);
    p3 += dot(p3, p3.zyx + 31.32);
    return fract((p3.x + p3.y) * p3.z);
  }

  float noise3D(vec3 p) {
    vec3 i = floor(p);
    vec3 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(
      mix(mix(hash13(i + vec3(0,0,0)), hash13(i + vec3(1,0,0)), f.x),
          mix(hash13(i + vec3(0,1,0)), hash13(i + vec3(1,1,0)), f.x), f.y),
      mix(mix(hash13(i + vec3(0,0,1)), hash13(i + vec3(1,0,1)), f.x),
          mix(hash13(i + vec3(0,1,1)), hash13(i + vec3(1,1,1)), f.x), f.y),
      f.z
    );
  }

  float fbm3(vec3 p) {
    float v = 0.0;
    float a = 0.5;
    for (int i = 0; i < 4; i++) {
      v += a * noise3D(p);
      p = p * 2.03 + vec3(13.7, -7.3, 5.1);
      a *= 0.5;
    }
    return v;
  }
`;

function createCedarMaterial(isHover = false) {
  const mat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    roughness: 0.42,
    metalness: 0.0,
    clearcoat: 0.35,
    clearcoatRoughness: 0.28,
    envMapIntensity: isHover ? 1.35 : 0.92,
    emissive: isHover ? new THREE.Color('#4A2B12') : new THREE.Color('#000000'),
    emissiveIntensity: isHover ? 0.55 : 0.0
  });

  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uInkMix = sharedUniforms.uInkMix;
    shader.uniforms.uExplodeAvg = sharedUniforms.uExplodeAvg;
    shader.vertexShader = shader.vertexShader
      .replace(
        '#include <common>',
        `#include <common>
         attribute vec4 aWoodCoord;
         varying vec4 vWoodCoord;
         varying vec3 vWoodWorld;`
      )
      .replace(
        '#include <begin_vertex>',
        `#include <begin_vertex>
         vWoodCoord = aWoodCoord;
         vWoodWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;`
      );

    shader.fragmentShader = shader.fragmentShader
      .replace(
        '#include <common>',
        `#include <common>
         uniform float uInkMix;
         uniform float uExplodeAvg;
         varying vec4 vWoodCoord;
         varying vec3 vWoodWorld;
         ${GLSL_NOISE_LIB}`
      )
      .replace(
        '#include <map_fragment>',
        `#include <map_fragment>
         float seed = abs(vWoodCoord.w);
         float isColumnCut = step(0.5, -vWoodCoord.w);
         // Quarter-sawn / rift-sawn off-center pith for beams & Dougong so growth rings flow tightly without bullseye blobs
         vec2 sawnPith = vec2(0.24 + sin(seed * 17.3) * 0.055, -0.19 + cos(seed * 29.1) * 0.055);
         vec2 colPith  = vec2(0.085 * sin(seed * 11.7), 0.085 * cos(seed * 19.3));
         vec2 pithOffset = mix(sawnPith, colPith, isColumnCut);
         vec2 crossPos = vWoodCoord.yz - pithOffset;
         float along = vWoodCoord.x;

         vec3 sampleP = vec3(along * 3.2 + seed * 3.7, crossPos.x * 22.0, crossPos.y * 22.0);
         float swirl = fbm3(sampleP);
         float knotDist = length(vec2(along * 2.1 - sin(seed * 9.2) * 0.42, crossPos.x * 9.5 + cos(seed * 5.1) * 0.25));
         float knotSwirl = exp(-knotDist * knotDist * 28.0) * 0.24;

         float radial = length(crossPos) + swirl * 0.018 + knotSwirl * 0.028;
         float ringWave = sin(radial * 340.0 + swirl * 3.6);
         float rings = smoothstep(-0.62, 0.58, ringWave);

         float fibers = noise3D(vec3(along * 68.0, crossPos.x * 320.0, crossPos.y * 320.0 + seed * 11.0));
         float medullary = noise3D(vec3(along * 14.0 + seed, crossPos.x * 95.0, crossPos.y * 95.0));
         float patina = 0.86 + 0.20 * fbm3(vec3(along * 1.6, crossPos.x * 7.0, crossPos.y * 7.0 + seed));
         float grain = clamp(rings * 0.64 + fibers * 0.24 + medullary * 0.12, 0.0, 1.0);

         // Strictly bounded Aged Cedar (#5C3A21) <-> Chestnut (#3D2616)
         vec3 earlyWood = pow(vec3(0.375, 0.232, 0.128), vec3(2.2)) * patina; // Deep #5C3A21 aged Chinese fir
         vec3 lateWood  = pow(vec3(0.205, 0.122, 0.068), vec3(2.2)) * patina; // Resinous #3D2616 chestnut latewood

         // Natural coffer self-occlusion under deep eaves so outer 望板/rafters read as deep oiled fir rather than orange glare
         float eaveRad = length(vWoodWorld.xz);
         float roofSoffitMask = smoothstep(3.32, 3.68, vWoodWorld.y) * (1.0 - smoothstep(0.15, 0.65, uExplodeAvg));
         float eaveShade = mix(1.0, mix(0.76, 0.52, smoothstep(0.85, 2.15, eaveRad)), roofSoffitMask);

         vec3 woodCol = mix(lateWood, earlyWood, grain) * eaveShade;
         vec3 inkWoodCol = mix(pow(vec3(0.25, 0.165, 0.102), vec3(2.2)), pow(vec3(0.48, 0.325, 0.195), vec3(2.2)), grain);
         diffuseColor.rgb *= mix(woodCol, inkWoodCol, uInkMix * 0.92);

         float woodHeight = rings * 0.62 + fibers * 0.38;`
      )
      .replace(
        '#include <roughnessmap_fragment>',
        `#include <roughnessmap_fragment>
         roughnessFactor = mix(clamp(roughness + (0.5 - grain) * 0.10, 0.30, 0.56), 0.78, uInkMix);`
      )
      .replace(
        '#include <clearcoat_fragment>',
        `#include <clearcoat_fragment>
         clearcoatFactor *= (1.0 - uInkMix * 0.92);`
      )
      .replace(
        '#include <normal_fragment_maps>',
        `#include <normal_fragment_maps>
         // Physically-scaled Mikkelsen screen-space derivative surface gradient bump mapping (1.1mm grain relief)
         vec2 dWood = clamp(vec2(dFdx(woodHeight), dFdy(woodHeight)), vec2(-0.22), vec2(0.22));
         vec3 dPxW = dFdx(vViewPosition);
         vec3 dPyW = dFdy(vViewPosition);
         vec3 r1W = cross(dPyW, normal);
         vec3 r2W = cross(normal, dPxW);
         float detW = dot(dPxW, r1W);
         float edgeGuardW = step(1e-10, abs(detW)) * step(dot(dPxW, dPxW) + dot(dPyW, dPyW), 0.0025);
         vec3 surfGradW = sign(detW) * (dWood.x * r1W + dWood.y * r2W);
         normal = normalize(abs(detW) * normal - surfGradW * (0.0011 * edgeGuardW * (1.0 - uInkMix * 0.75)));`
      );
  };
  mat.customProgramCacheKey = () => (isHover ? 'cedar-hover-v3' : 'cedar-base-v3');
  return mat;
}

function createGlazedTileMaterial(isHover = false) {
  const mat = new THREE.MeshPhysicalMaterial({

    clearcoatRoughness: 0.11,
    envMapIntensity: isHover ? 1.65 : 1.32,
    emissive: isHover ? new THREE.Color('#1E3640') : new THREE.Color('#000000'),
    emissiveIntensity: isHover ? 0.55 : 0.0
  });

  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = sharedUniforms.uTime;
    shader.uniforms.uInkMix = sharedUniforms.uInkMix;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>\nvarying vec3 vTileWorld;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>\nvTileWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;`);

    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>\nuniform float uTime;\nuniform float uInkMix;\nvarying vec3 vTileWorld;\n${GLSL_NOISE_LIB}`)
      .replace(
        '#include <map_fragment>',
        `#include <map_fragment>
         float glazeVar = fbm3(vTileWorld * 6.5);
         float radialAngle = atan(vTileWorld.z, vTileWorld.x);
         float radialDist = length(vTileWorld.xz);
         float rivulet = noise3D(vec3(radialAngle * 38.0, radialDist * 9.0 - uTime * 1.4, vTileWorld.y * 4.0));

         vec3 slateBase = pow(vec3(0.118, 0.158, 0.180), vec3(2.2)) * (0.90 + glazeVar * 0.32); // Deep wet #2B373D烟雨青黛
         vec3 mineralCyan = mix(
           pow(vec3(0.085, 0.305, 0.340), vec3(2.2)),
           pow(vec3(0.185, 0.495, 0.425), vec3(2.2)),
           clamp(glazeVar * 0.7 + (vTileWorld.y - 3.4) * 0.35, 0.0, 1.0)
         );
         diffuseColor.rgb *= mix(slateBase, mineralCyan, uInkMix);`
      )
      .replace(
        '#include <roughnessmap_fragment>',
        `#include <roughnessmap_fragment>
         roughnessFactor = mix(mix(0.14, 0.22, rivulet), 0.65, uInkMix);`
      )
      .replace(
        '#include <clearcoat_fragment>',
        `#include <clearcoat_fragment>
         clearcoatFactor *= (1.0 - uInkMix * 0.90);`
      );
  };
  mat.customProgramCacheKey = () => (isHover ? 'tile-hover-v2' : 'tile-base-v2');
  return mat;
}

function createPlinthStoneMaterial(isHover = false) {
  const mat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    roughness: 0.34,
    metalness: 0.02,
    clearcoat: 0.38,
    clearcoatRoughness: 0.20,
    envMapIntensity: 0.96,
    emissive: isHover ? new THREE.Color('#27353B') : new THREE.Color('#000000'),
    emissiveIntensity: isHover ? 0.5 : 0.0
  });

  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uInkMix = sharedUniforms.uInkMix;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>\nvarying vec3 vStoneW;\nvarying vec3 vStoneN;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>\nvStoneW = (modelMatrix * vec4(transformed, 1.0)).xyz;\nvStoneN = normalize(mat3(modelMatrix) * objectNormal);`);

    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>\nuniform float uInkMix;\nvarying vec3 vStoneW;\nvarying vec3 vStoneN;\n${GLSL_NOISE_LIB}`)
      .replace(
        '#include <map_fragment>',
        `#include <map_fragment>
         float n = fbm3(vStoneW * 4.8);
         float chiselStripes = sin(vStoneW.x * 165.0 + vStoneW.z * 165.0 + n * 5.2) * 0.5 + 0.5;
         float bushHammer = noise3D(vStoneW * vec3(48.0, 128.0, 48.0)) * 0.52 + noise3D(vStoneW * 22.0) * 0.30 + chiselStripes * 0.18;
         float wTop = smoothstep(0.45, 0.78, abs(vStoneN.y));
         vec2 topGrid = abs(fract(vStoneW.xz * 1.25 + 0.5) - 0.5);
         float topSeam = smoothstep(0.010, 0.028, min(topGrid.x, topGrid.y));
         // Running-bond 80mm ashlar masonry courses clearly articulated across every 160mm vertical riser
         float runCoord = abs(vStoneN.x) > abs(vStoneN.z) ? vStoneW.z : vStoneW.x;
         float courseIdx = floor(vStoneW.y / 0.080 + 0.02);
         float vertJoint = abs(fract(runCoord * 1.35 + mod(courseIdx, 2.0) * 0.5) - 0.5);
         float bedJoint  = abs(fract(vStoneW.y / 0.080 + 0.02) - 0.5);
         float riserVert = smoothstep(0.010, 0.032, vertJoint);
         float riserBed  = smoothstep(0.035, 0.115, 0.5 - bedJoint);
         float riserSeam = riserVert * (0.35 + 0.65 * riserBed);
         float seam = mix(riserSeam, topSeam, wTop);
         float blockVar = 0.88 + 0.22 * hash13(vec3(floor(runCoord * 1.35 + mod(courseIdx, 2.0) * 0.5), courseIdx, floor(vStoneW.x * 0.5)));
         float groundWetAO = mix(0.54, 1.0, smoothstep(0.0, 0.14, vStoneW.y));
         vec3 wetSlate = pow(vec3(0.098, 0.126, 0.144), vec3(2.2)) * (0.76 + n * 0.34 + bushHammer * 0.20) * blockVar * (0.52 + 0.48 * seam) * groundWetAO;
         // Neutral-cool Song sumi bluestone (淡墨青石: B >= R prevents ochre blotches, modest cyan keeps mineral 石青/石绿 exclusive to roof/peaks)
         vec3 inkStone = pow(vec3(0.300, 0.308, 0.310), vec3(2.2)) * (0.84 + n * 0.22 + bushHammer * 0.10) * blockVar * (0.70 + 0.30 * seam);
         diffuseColor.rgb *= mix(wetSlate, inkStone, uInkMix);
         float stoneHeight = n * 0.36 + bushHammer * 0.52 + seam * 0.68;`
      )
      .replace(
        '#include <roughnessmap_fragment>',
        `#include <roughnessmap_fragment>
         roughnessFactor = mix(clamp(roughness + (0.5 - bushHammer) * 0.18 + (1.0 - seam) * 0.14, 0.22, 0.56), 0.90, uInkMix);`
      )
      .replace(
        '#include <clearcoat_fragment>',
        `#include <clearcoat_fragment>
         clearcoatFactor *= (1.0 - uInkMix * 0.98);`
      )
      .replace(
        '#include <normal_fragment_maps>',
        `#include <normal_fragment_maps>
         // Physically-scaled Mikkelsen screen-space derivative surface gradient bump mapping (3.8mm chiseled stone & mortar relief!)
         vec2 dStone = clamp(vec2(dFdx(stoneHeight), dFdy(stoneHeight)), vec2(-0.32), vec2(0.32));
         vec3 dPxS = dFdx(vViewPosition);
         vec3 dPyS = dFdy(vViewPosition);
         vec3 r1S = cross(dPyS, normal);
         vec3 r2S = cross(normal, dPxS);
         float detS = dot(dPxS, r1S);
         float stoneEdgeGuard = step(1e-10, abs(detS)) * step(dot(dPxS, dPxS) + dot(dPyS, dPyS), 0.0042);
         vec3 surfGradS = sign(detS) * (dStone.x * r1S + dStone.y * r2S);
         normal = normalize(abs(detS) * normal - surfGradS * (0.0038 * stoneEdgeGuard * (1.0 - uInkMix * 0.65)));`
      );
  };
  mat.customProgramCacheKey = () => (isHover ? 'stone-hover-v4' : 'stone-base-v4');
  return mat;
}

const cedarMat = createCedarMaterial(false);

// ============================================================================
// 7. WET BLUESTONE MIRROR REFLECTION, PCSS FLOOR SHADOWS & ORGANIC RIPPLES

const rtReflectCourtyard = new THREE.WebGLRenderTarget(1280, 720, {
  type: THREE.HalfFloatType,
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  depthBuffer: true,

const rtReflectDeck = new THREE.WebGLRenderTarget(640, 640, {
  type: THREE.HalfFloatType,
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,

  samples: 4

const reflectCam = new THREE.PerspectiveCamera();
const reflectMatrixCourtyard = new THREE.Matrix4();
const reflectMatrixDeck = new THREE.Matrix4();
const moonShadowMatrixUniform = new THREE.Matrix4();

const RIPPLE_CENTERS = [
  new THREE.Vector2( 2.34,  2.34),
  new THREE.Vector2(-2.34,  2.34),
  new THREE.Vector2(-2.34, -2.34),
  new THREE.Vector2( 2.34, -2.34),
  new THREE.Vector2( 0.00,  2.13),
  new THREE.Vector2( 1.05,  2.18),
  new THREE.Vector2(-1.05,  2.18),
  new THREE.Vector2( 2.13,  0.00),
  new THREE.Vector2( 2.18,  1.05),
  new THREE.Vector2( 2.18, -1.05),
  new THREE.Vector2( 0.00, -2.13),
  new THREE.Vector2( 1.05, -2.18),
  new THREE.Vector2(-1.05, -2.18),
  new THREE.Vector2(-2.13,  0.00),
  new THREE.Vector2(-2.18,  1.05),
  new THREE.Vector2(-2.18, -1.05)
];

const GROVE_ANCHORS = [
  new THREE.Vector2(-3.95, -2.75),
  new THREE.Vector2( 3.85, -3.85),
  new THREE.Vector2(-3.55,  3.25)
];

function createWetReflectiveFloorMaterial(reflectRT, reflectVPMat, isDeck = false) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: sharedUniforms.uTime,
      uInkMix: sharedUniforms.uInkMix,
      tReflect: { value: reflectRT.texture },
      uReflectMatrix: { value: reflectVPMat },
      tMoonShadow: { value: fallbackShadowTex },
      uMoonShadowMatrix: { value: moonShadowMatrixUniform },
      uShadowReady: { value: 0.0 },
      uCamPos: { value: camera.position },
      uLanternPos: { value: lanternLight.position },
      uRipples: { value: RIPPLE_CENTERS },
      uGroves: { value: GROVE_ANCHORS },
      uIsDeck: { value: isDeck ? 1.0 : 0.0 }
    },
    vertexShader: `
      uniform mat4 uReflectMatrix;
      uniform mat4 uMoonShadowMatrix;
      varying vec3 vWorldPos;
      varying vec4 vReflectClip;
      varying vec4 vMoonShadowCoord;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        vReflectClip = uReflectMatrix * wp;
        vMoonShadowCoord = uMoonShadowMatrix * vec4(wp.xyz + vec3(0.0, 0.015, 0.0), 1.0);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      #include <packing>
      uniform float uTime;
      uniform float uInkMix;
      uniform sampler2D tReflect;
      uniform sampler2D tMoonShadow;
      uniform float uShadowReady;
      uniform vec3 uCamPos;
      uniform vec3 uLanternPos;
      uniform vec2 uRipples[16];
      uniform vec2 uGroves[3];
      uniform float uIsDeck;

      varying vec3 vWorldPos;
      varying vec4 vReflectClip;
      varying vec4 vMoonShadowCoord;

      float hash21(vec2 p) {
        p = fract(p * vec2(123.34, 456.21));
        p += dot(p, p + 45.32);
        return fract(p.x * p.y);
      }

      vec2 hash22(vec2 p) {
        vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.xx + p3.yz) * p3.zy);
      }

      float noise2(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x),
          mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), f.x),
          f.y
        );
      }

      float fbm2(vec2 p) {
        float v = 0.0;
        float a = 0.5;
        for (int i = 0; i < 4; i++) {
          v += a * noise2(p);
          p = p * 2.04 + vec2(7.1, -11.3);
          a *= 0.5;
        }
        return v;
      }

      float sampleFloorPCSS(vec4 shadowCoord) {
        vec3 sc = shadowCoord.xyz / max(shadowCoord.w, 1e-4);
        sc.z -= 0.00055;
        float readyMask = step(0.5, uShadowReady);
        float inZ = step(0.0, sc.z) * step(sc.z, 1.0);
        float edgeDist = min(min(sc.x, 1.0 - sc.x), min(sc.y, 1.0 - sc.y));
        float borderFade = smoothstep(0.02, 0.22, edgeDist) * inZ * readyMask;

        vec2 texel = vec2(1.0 / 2048.0);
        float ign = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715)))) * 6.2831853;
        float ca = cos(ign), sa = sin(ign);
        mat2 rot = mat2(ca, -sa, sa, ca);

        // Uniform control flow (zero early return before texture2D -> zero HLSL X3595 gradient warnings!)
        float bSum = 0.0, bCnt = 0.0;
        for (int i = 0; i < 8; i++) {
          float fi = float(i);
          float r = sqrt((fi + 0.5) / 8.0) * 14.0;
          float th = fi * 2.3999632;
          vec2 uv = clamp(sc.xy + (rot * vec2(cos(th), sin(th))) * texel * r, 0.001, 0.999);
          float d = unpackRGBAToDepth(texture2D(tMoonShadow, uv));
          float blk = step(d, sc.z);
          bSum += d * blk;
          bCnt += blk;
        }
        float hasBlocker = step(0.5, bCnt);
        float avgB = bSum / max(bCnt, 1.0);
        // Wide rain-mist contact-hardening penumbra: crisp near column bases, softly diffused for high eaves
        float penumbra = mix(1.8, clamp((sc.z - avgB) / max(avgB, 0.03) * 48.0, 1.6, 18.0), hasBlocker);
        float lit = 0.0;
        for (int j = 0; j < 12; j++) {
          float fj = float(j);
          float r = sqrt((fj + 0.5) / 12.0) * penumbra;
          float th = fj * 2.3999632 + 1.0472;
          vec2 uv = clamp(sc.xy + (rot * vec2(cos(th), sin(th))) * texel * r, 0.001, 0.999);
          float d = unpackRGBAToDepth(texture2D(tMoonShadow, uv));
          lit += step(sc.z, d);
        }
        float rawShadow = mix(1.0, lit / 12.0, hasBlocker);
        return mix(1.0, rawShadow, borderFade);
      }

      void evalOrganicRippleGrid(vec2 xz, float scale, float seedShift, float puddleMask, inout vec2 rippleGrad, inout float rippleFoam) {
        vec2 gUv = xz * scale + vec2(seedShift * 3.7, -seedShift * 2.3);
        vec2 cell = floor(gUv);
        vec2 local = fract(gUv) - 0.5;
        vec2 rnd2 = hash22(cell + seedShift * 19.1);
        // Gate active cells and jitter impact position organically inside cell (zero checkerboard alignment!)
        if (rnd2.x > 0.32) {
          vec2 dropCenter = (rnd2 - 0.5) * 0.54;
          vec2 delta = local - dropCenter;
          float rr = length(delta);
          float period = 0.52 + rnd2.y * 0.45;
          float rawCycle = uTime * period + rnd2.x * 11.3;
          float cycleIdx = floor(rawCycle);
          float activeGate = step(0.38, hash21(cell + cycleIdx * 7.13));
          float ph = fract(rawCycle);
          float maxRad = 0.34;
          float ringR = ph * maxRad;
          float env = exp(-abs(rr - ringR) * 34.0) * (1.0 - ph) * (1.0 - ph) * activeGate * puddleMask;
          rippleGrad += normalize(delta + vec2(1e-4)) * sin((rr - ringR) * 82.0) * env * 0.44;
          rippleFoam += max(0.0, cos((rr - ringR) * 62.0)) * env * 0.24;
        }
      }

      void main() {
        vec2 xz = vWorldPos.xz;
        float distOrigin = length(xz);

        float slabScale = uIsDeck > 0.5 ? 1.54 : 1.05;
        vec2 slabUV = xz * slabScale;
        vec2 cellId = floor(slabUV);
        if (uIsDeck < 0.5 && mod(cellId.y, 2.0) > 0.5) {
          slabUV.x += 0.5;
          cellId = floor(slabUV);
        }
        vec2 gv = abs(fract(slabUV) - 0.5);
        float mortar = smoothstep(0.478, 0.494, max(gv.x, gv.y));
        float slabTone = 0.90 + 0.18 * hash21(cellId);
        float microGrain = noise2(xz * 26.0);

        float puddleNoise = fbm2(xz * 0.58 + vec2(1.4, -0.8));
        float cornerPuddleBoost = 0.0;
        if (uIsDeck < 0.5) {
          for (int c = 0; c < 4; c++) {
            cornerPuddleBoost += exp(-length(xz - uRipples[c]) * 1.45) * 0.32;
          }
          // Gentle foreground rainwater depression across the southern courtyard so the #FF9A3C palace lantern reflection gleams clearly
          float frontPool = exp(-pow((distOrigin - 8.2) / 3.4, 2.0)) * smoothstep(2.0, 5.5, xz.y) * 0.34;
          cornerPuddleBoost += frontPool;
        }
        float puddleMask = uIsDeck > 0.5
          ? smoothstep(0.28, 0.54, puddleNoise + 0.18)
          : smoothstep(0.24, 0.52, puddleNoise + 0.18 * exp(-distOrigin * 0.07) + cornerPuddleBoost);

        vec2 rippleGrad = vec2(0.0);
        float rippleFoam = 0.0;
        if (uIsDeck < 0.5) {
          for (int i = 0; i < 16; i++) {
            bool isCorner = (i < 4);
            float rate = isCorner ? 1.05 : 0.68;
            float maxR = isCorner ? 0.96 : 0.55;
            vec2 d = xz - uRipples[i];
            float r = length(d);
            if (r < maxR + 0.14) {
              // Dual nested capillary wave trains at the 4 eave corners (uniform 2-step loop)
              for (int tr = 0; tr < 2; tr++) {
                float trWeight = (tr == 0) ? 1.0 : (isCorner ? 0.85 : 0.0);
                float phase = fract(uTime * rate + float(i) * 0.193 + float(tr) * 0.5);
                float ringR = phase * maxR;
                float band = r - ringR;
                float env = exp(-abs(band) * (isCorner ? 22.0 : 26.0)) * (1.0 - phase) * (1.0 - phase) * trWeight;
                float wave = sin(band * 66.0) * env * (isCorner ? 1.25 : 0.85);
                rippleGrad += normalize(d + vec2(1e-4)) * wave;
                rippleFoam += max(0.0, cos(band * 52.0)) * env * (isCorner ? 0.88 : 0.52);
              }
            }
          }
          evalOrganicRippleGrid(xz, 1.65, 1.0, puddleMask, rippleGrad, rippleFoam);
          evalOrganicRippleGrid(xz + vec2(0.31, 0.19), 2.35, 2.0, puddleMask, rippleGrad, rippleFoam);
        } else {
          float w = sin(xz.x * 14.0 + uTime * 2.2) * cos(xz.y * 14.0 - uTime * 1.8) * 0.014;
          rippleGrad += vec2(w, -w) * puddleMask;
        }

        float moonShadow = sampleFloorPCSS(vMoonShadowCoord);

        vec3 N = normalize(vec3(-rippleGrad.x * 0.35, 1.0, -rippleGrad.y * 0.35));
        vec3 V = normalize(uCamPos - vWorldPos);
        float NoV = max(dot(N, V), 0.02);
        float fresnel = 0.06 + 0.94 * pow(1.0 - NoV, 4.0);

        vec2 reflUV = (vReflectClip.xy / max(vReflectClip.w, 0.001)) * 0.5 + 0.5;
        vec2 warpedUV = clamp(reflUV + rippleGrad * (0.036 * (1.0 - uInkMix * 0.75)) + (1.0 - puddleMask) * (microGrain - 0.5) * 0.006 * (1.0 - uInkMix), 0.002, 0.998);
        // 5-tap rotated wet-slate roughness prefilter eliminates diagonal stair-step reflection jaggies while keeping puddles mirror-crisp
        vec2 rBlur = (uIsDeck > 0.5 ? vec2(1.0 / 640.0) : vec2(1.0 / 1280.0, 1.0 / 720.0)) * mix(1.55, 0.62, puddleMask);
        vec3 reflCol = texture2D(tReflect, warpedUV).rgb * 0.36
          + texture2D(tReflect, clamp(warpedUV + vec2( 0.85,  0.35) * rBlur, 0.002, 0.998)).rgb * 0.16
          + texture2D(tReflect, clamp(warpedUV + vec2(-0.85, -0.35) * rBlur, 0.002, 0.998)).rgb * 0.16
          + texture2D(tReflect, clamp(warpedUV + vec2(-0.35,  0.85) * rBlur, 0.002, 0.998)).rgb * 0.16
          + texture2D(tReflect, clamp(warpedUV + vec2( 0.35, -0.85) * rBlur, 0.002, 0.998)).rgb * 0.16;

        vec3 baseSlate = vec3(0.018, 0.025, 0.031) * slabTone * (1.0 - mortar * 0.45) * (0.88 + microGrain * 0.22);
        // Mode B: Match inner terrace (deckMirrorMesh) to surrounding Song sumi-ink bluestone 压阑石/plinth tone; dissolve outer courtyard into misty Xuan scroll留白
        float groveSlopeMask = 0.0;
        if (uIsDeck < 0.5) {
          for (int g = 0; g < 3; g++) {
            float dg = length((xz - uGroves[g]) * vec2(0.85, 1.05));
            groveSlopeMask = max(groveSlopeMask, smoothstep(1.95, 0.38, dg) * (0.55 + 0.45 * puddleNoise));
          }
        }
        float inkPaperBlank = uIsDeck > 0.5 ? 0.0 : clamp(smoothstep(2.75, 7.60, distOrigin) - groveSlopeMask * 0.88, 0.0, 1.0);
        // Subtle Song waterside ink-ripple brushwork (远水烟波) before dissolving seamlessly into #EAE3D2 Xuan paper
        float waterBrushWave = sin(xz.x * 2.4 + sin(xz.y * 1.7) * 1.2) * cos(xz.y * 4.8 + puddleNoise * 3.0);
        float inkWaterLines = smoothstep(0.76, 0.95, waterBrushWave) * smoothstep(11.5, 3.4, distOrigin) * 0.10;
        vec3 inkPaperGround = vec3(0.90, 0.86, 0.77) - vec3(0.18, 0.17, 0.16) * inkWaterLines;

        vec3 inkDeckStone = pow(vec3(0.298, 0.306, 0.308), vec3(2.2)) * (0.94 + 0.10 * slabTone) * (1.0 - mortar * 0.24);
        vec3 inkCourtStone = mix(
          vec3(0.32, 0.34, 0.34) * slabTone * (1.0 - mortar * 0.18),
          vec3(0.22, 0.28, 0.27) * (0.90 + 0.16 * puddleNoise),
          groveSlopeMask * 0.82
        );
        vec3 inkSlate = uIsDeck > 0.5 ? inkDeckStone : mix(inkCourtStone, inkPaperGround, inkPaperBlank);
        vec3 stoneAlbedo = mix(baseSlate, inkSlate, uInkMix);

        vec3 toLantern = uLanternPos - vWorldPos;
        float lDist = length(toLantern);
        vec3 L = toLantern / max(lDist, 0.01);
        float atten = 1.0 / (1.0 + 0.11 * lDist + 0.052 * lDist * lDist);
        vec3 warmLight = vec3(1.0, 0.58, 0.20) * max(dot(N, L), 0.0) * atten * (uIsDeck > 0.5 ? 3.0 : 1.9);

        vec3 H = normalize(L + V);
        float specPow = mix(34.0, 220.0, puddleMask);
        float spec = pow(max(dot(N, H), 0.0), specPow) * mix(0.22, 1.95, puddleMask);
        vec3 warmSpec = vec3(1.0, 0.60, 0.23) * spec * atten * (uIsDeck > 0.5 ? 3.8 : 2.35);

        vec3 moonDir = normalize(vec3(-6.8, 12.2, 8.2));
        vec3 Hm = normalize(moonDir + V);
        float moonSpec = pow(max(dot(N, Hm), 0.0), mix(24.0, 140.0, puddleMask)) * mix(0.10, 0.55, puddleMask) * moonShadow;

        // Overcast rain-night sky diffuse dominates over direct moon so roof shadow is atmospheric rather than a harsh dark rectangle
        vec3 ambientPlusMoon = vec3(0.42, 0.58, 0.70) + vec3(0.34, 0.46, 0.56) * moonShadow;
        vec3 dampMoonSheen = vec3(0.008, 0.013, 0.018) * moonShadow * (1.0 - puddleMask * 0.45);
        // Matched neutral-cool sumi irradiance on deckMirrorMesh so inner terrace matches surrounding 压阑石 seamlessly in Mode B!
        vec3 inkDeckLit = stoneAlbedo * (vec3(0.56, 0.59, 0.60) + vec3(0.46, 0.48, 0.49) * moonShadow) + vec3(0.010, 0.012, 0.013);
        vec3 inkFloorLit = uIsDeck > 0.5 ? inkDeckLit : (stoneAlbedo * mix(0.86, 1.0, moonShadow * (1.0 - inkPaperBlank) + inkPaperBlank));
        vec3 litStone = mix(
          stoneAlbedo * (ambientPlusMoon + warmLight) + dampMoonSheen,
          inkFloorLit,
          uInkMix
        );
        // Specular water/sky reflection is physically independent of direct moon shadow, and fades cleanly to 0 in Mode B matte Song scroll!
        float reflStrength = mix(0.32, 0.88, puddleMask) * mix(0.48, 1.0, fresnel) * (1.0 - mortar * 0.52) * (1.0 - uInkMix);

        vec3 mirrorRefl = reflCol * (1.0 + 0.18 * clamp(atten * 1.8, 0.0, 1.0) * (1.0 - uInkMix));
        vec3 col = mix(litStone, mirrorRefl, clamp(reflStrength, 0.0, 0.88));
        col += (warmSpec + vec3(0.42, 0.56, 0.70) * moonSpec) * (1.0 - uInkMix);
        float inkFoamMask = uIsDeck > 0.5 ? 0.0 : (0.06 * (1.0 - inkPaperBlank));
        col += mix(vec3(0.30, 0.42, 0.52), vec3(0.28, 0.30, 0.30), uInkMix) * rippleFoam * mix(0.40, inkFoamMask, uInkMix);

        if (uIsDeck < 0.5) {
          float edgeFade = smoothstep(10.5, 24.5, distOrigin);
          vec3 horizonCol = mix(vec3(0.0045, 0.0095, 0.0125), vec3(0.90, 0.86, 0.77), uInkMix);
          col = mix(col, horizonCol, max(edgeFade, uInkMix * smoothstep(7.2, 16.0, distOrigin)));
        }

        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
}

// ============================================================================
// 8. DUAL-MODE SKY & SONG DYNASTY 《千里江山图》 DISTANT MOUNTAIN DOME
// ============================================================================
const skyDomeMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    uTime: sharedUniforms.uTime,
    uInkMix: sharedUniforms.uInkMix
  },
  vertexShader: `
    varying vec3 vWorldDir;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldDir = normalize(wp.xyz);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform float uInkMix;
    varying vec3 vWorldDir;

    float h11(float p) {
      p = fract(p * 0.1031);
      p *= p + 33.33;
      p *= p + p;
      return fract(p);
    }

    float n1(float x) {
      float i = floor(x);
      float f = fract(x);
      f = f * f * (3.0 - 2.0 * f);
      return mix(h11(i), h11(i + 1.0), f);
    }

    float mountainRidge(float az, float seed, float freq, float amp) {
      float h = 0.0;
      float a = amp;
      float f = freq;
      for (int i = 0; i < 4; i++) {
        h += a * abs(n1(az * f + seed) * 2.0 - 1.0);
        f *= 2.12;
        a *= 0.48;
      }
      return h;
    }

    void main() {
      vec3 d = normalize(vWorldDir);
      float y = clamp(d.y, -0.2, 1.0);
      float az = atan(d.z, d.x);

      // Strictly calibrated linear radiance for deep Rain-Night #0F171A under single-gamma AgX
      vec3 nightZenith  = vec3(0.0036, 0.0076, 0.0098); // #0F171A
      vec3 nightHorizon = vec3(0.0092, 0.0172, 0.0222); // Misty rain horizon
      vec3 nightSky = mix(nightHorizon, nightZenith, smoothstep(0.0, 0.54, max(y, 0.0)));
      float moonGlow = pow(max(0.0, dot(d, normalize(vec3(-0.46, 0.62, 0.63)))), 8.0);
      nightSky += vec3(0.012, 0.021, 0.029) * moonGlow;

      float mFar = mountainRidge(az, 4.2, 2.8, 0.11) + 0.025;
      if (y < mFar && y > -0.05) {
        float mist = smoothstep(-0.01, mFar, y);
        nightSky = mix(vec3(0.0046, 0.0092, 0.0120), nightSky * 0.72, mist * 0.58);
      }

      // Mode B: Song Dynasty Xuan Paper + 《千里江山图》 Mineral Azurite/Malachite Peaks (horizon unified with ground留白!)
      vec3 paperBase = vec3(0.90, 0.86, 0.77);
      vec3 paperTop  = vec3(0.84, 0.79, 0.69);
      vec3 inkSky = mix(paperBase, paperTop, smoothstep(0.06, 0.75, max(y, 0.0)));

      float r3 = mountainRidge(az + 0.7, 19.3, 2.3, 0.165) + 0.052;
      float r2 = mountainRidge(az - 1.1, 8.7,  3.1, 0.118) + 0.025;
      float r1 = mountainRidge(az + 2.3, 31.1, 4.0, 0.078) + 0.006;

      if (y < r3) {
        float t = clamp((r3 - y) / 0.13, 0.0, 1.0);
        // Mineral 石青 crest -> 石绿 slope -> 云气留白 foot mist
        vec3 crest3 = mix(vec3(0.12, 0.30, 0.34), vec3(0.26, 0.47, 0.41), smoothstep(0.0, 0.42, t));
        vec3 col3 = mix(crest3, paperBase, smoothstep(0.32, 0.92, t));
        inkSky = mix(inkSky, col3, smoothstep(0.0, 0.005, r3 - y) * 0.78);
      }
      if (y < r2) {
        float t = clamp((r2 - y) / 0.095, 0.0, 1.0);
        vec3 crest2 = mix(vec3(0.08, 0.24, 0.27), vec3(0.22, 0.42, 0.36), smoothstep(0.0, 0.40, t));
        vec3 col2 = mix(crest2, paperBase, smoothstep(0.28, 0.88, t));
        inkSky = mix(inkSky, col2, smoothstep(0.0, 0.005, r2 - y) * 0.86);
      }
      if (y < r1) {
        float t = clamp((r1 - y) / 0.065, 0.0, 1.0);
        vec3 col1 = mix(vec3(0.11, 0.18, 0.19), paperBase, smoothstep(0.22, 0.85, t));
        inkSky = mix(inkSky, col1, smoothstep(0.0, 0.004, r1 - y) * 0.82);
      }

      vec3 finalSky = mix(nightSky, inkSky, uInkMix);
      gl_FragColor = vec4(finalSky, 1.0);
    }
  `
});

const skyDome = new THREE.Mesh(new THREE.SphereGeometry(52, 48, 32), skyDomeMat);
skyDome.frustumCulled = false;
scene.add(skyDome);

// ============================================================================
// 9. CARPENTER PARAMETRIC MORTISE & TENON GEOMETRY ENGINE
// ============================================================================
const pavilionGroup = new THREE.Group();
scene.add(pavilionGroup);

const components = [];
const interactiveMeshes = [];
const alignmentSegments = [];

function prepPartGeo(geo, grainAxis = 'x', seed = 1.0) {
  const g = geo.index ? geo.toNonIndexed() : geo.clone();
  if (!g.attributes.normal) g.computeVertexNormals();
  const count = g.attributes.position.count;
  if (!g.attributes.uv) {
    g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(count * 2), 2));
  }
  const pos = g.attributes.position;
  const woodArr = new Float32Array(count * 4);
  for (let i = 0; i < count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    if (grainAxis === 'y') {
      woodArr[i * 4 + 0] = y; woodArr[i * 4 + 1] = x; woodArr[i * 4 + 2] = z;
    } else if (grainAxis === 'z') {
      woodArr[i * 4 + 0] = z; woodArr[i * 4 + 1] = x; woodArr[i * 4 + 2] = y;
    } else {
      woodArr[i * 4 + 0] = x; woodArr[i * 4 + 1] = y; woodArr[i * 4 + 2] = z;
    }
    woodArr[i * 4 + 3] = seed;
  }
  g.setAttribute('aWoodCoord', new THREE.BufferAttribute(woodArr, 4));
  return g;
}

function boxAt(w, h, d, cx, cy, cz, grainAxis = 'x', seed = 1.0) {
  const g = new THREE.BoxGeometry(w, h, d);
  g.translate(cx, cy, cz);
  return prepPartGeo(g, grainAxis, seed);
}

function registerPart({
  geo,
  name,
  role,
  layer,
  basePos = new THREE.Vector3(),
  rotY = 0,
  explodeVec = new THREE.Vector3(),
  matType = 'wood',
  dimsMm = null,
  volumeM3 = null,
  guideDrop = 0
}) {
  const matMap = {
    wood:  { base: cedarMat,  hover: cedarHoverMat },
    tile:  { base: tileMat,   hover: tileHoverMat },
    stone: { base: stoneMat,  hover: stoneHoverMat },
    bronze:{ base: bronzeMat, hover: bronzeHoverMat }
  };
  const pair = matMap[matType] || matMap.wood;
  const mesh = new THREE.Mesh(geo, pair.base);
  mesh.position.copy(basePos);
  mesh.rotation.y = rotY;
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  const sx = bb.max.x - bb.min.x;
  const sy = bb.max.y - bb.min.y;
  const sz = bb.max.z - bb.min.z;
  const computedDims = dimsMm || `${Math.round(sx * 1000)} × ${Math.round(sz * 1000)} × ${Math.round(sy * 1000)} mm`;
  const vol = volumeM3 || Math.max(0.001, sx * sy * sz * 0.65);

  const rec = {
    mesh,
    name,
    role,
    layer,
    basePos: basePos.clone(),
    explodeVec: explodeVec.clone(),
    baseMat: pair.base,
    hoverMat: pair.hover,
    dimsMm: computedDims,
    volumeM3: vol,
    explodable: layer > 0
  };

  mesh.userData.partRecord = rec;
  pavilionGroup.add(mesh);
  components.push(rec);
  interactiveMeshes.push(mesh);

  if (guideDrop > 0 && layer > 0) {
    alignmentSegments.push({
      rec,
      localOffset: new THREE.Vector3(0, bb.min.y, 0),
      dropLen: guideDrop
    });
  }
  return rec;
}

function buildDouGeo({
  topW = 0.30, botW = 0.21, totalH = 0.18, slotW = 0.11,
  earMode = 'cross', botMortiseW = 0.082, botMortiseD = 0.055, seed = 1.0
}) {
  const parts = [];
  const qiH = totalH * 0.42;
  const pingH = totalH * 0.18;
  const earH = totalH - qiH - pingH;

  const mH = Math.min(botMortiseD, qiH * 0.85);
  const sideCheek = (botW - botMortiseW) * 0.5;
  if (sideCheek > 0.008) {
    parts.push(boxAt(sideCheek, mH, botW, -(botMortiseW + sideCheek) * 0.5, mH * 0.5, 0, 'x', seed));
    parts.push(boxAt(sideCheek, mH, botW,  (botMortiseW + sideCheek) * 0.5, mH * 0.5, 0, 'x', seed));
    parts.push(boxAt(botMortiseW, mH, sideCheek, 0, mH * 0.5, -(botMortiseW + sideCheek) * 0.5, 'x', seed));
    parts.push(boxAt(botMortiseW, mH, sideCheek, 0, mH * 0.5,  (botMortiseW + sideCheek) * 0.5, 'x', seed));
  }

  const steps = 3;
  for (let s = 0; s < steps; s++) {
    const t0 = s / steps;
    const t1 = (s + 1) / steps;
    const y0 = mH + (qiH - mH) * t0;
    const y1 = mH + (qiH - mH) * t1;
    const w0 = botW + (topW - botW) * Math.pow(t0, 1.45);
    const w1 = botW + (topW - botW) * Math.pow(t1, 1.45);
    const cyl = new THREE.CylinderGeometry(w1 * Math.SQRT1_2, w0 * Math.SQRT1_2, y1 - y0, 4, 1);
    cyl.rotateY(Math.PI * 0.25);
    cyl.translate(0, (y0 + y1) * 0.5, 0);
    parts.push(prepPartGeo(cyl, 'x', seed));
  }

  parts.push(boxAt(topW, pingH, topW, 0, qiH + pingH * 0.5, 0, 'x', seed));

  const earY = qiH + pingH + earH * 0.5;
  const earSpan = (topW - slotW) * 0.5;
  if (earMode === 'cross') {
    for (const sx of [-1, 1]) {
      for (const sz of [-1, 1]) {
        parts.push(boxAt(earSpan, earH, earSpan, sx * (slotW + earSpan) * 0.5, earY, sz * (slotW + earSpan) * 0.5, 'x', seed));
      }
    }
  } else if (earMode === 'singleX') {
    for (const sz of [-1, 1]) {
      parts.push(boxAt(topW, earH, earSpan, 0, earY, sz * (slotW + earSpan) * 0.5, 'x', seed));
    }
  } else {
    for (const sx of [-1, 1]) {
      parts.push(boxAt(earSpan, earH, topW, sx * (slotW + earSpan) * 0.5, earY, 0, 'z', seed));
    }
  }
  return mergeGeometries(parts, false);
}

// Smooth lofted hexahedron slice [x0..x1] with optional end caps (zero internal coplanar seams!)
function loftSliceAt(x0, x1, yb0, yb1, yt0, yt1, thick0, thick1, seed, capLeft = true, capRight = true) {
  const hz0 = thick0 * 0.5, hz1 = thick1 * 0.5;
  const p000 = [x0, yb0, -hz0], p001 = [x0, yb0,  hz0];
  const p010 = [x0, yt0, -hz0], p011 = [x0, yt0,  hz0];
  const p100 = [x1, yb1, -hz1], p101 = [x1, yb1,  hz1];
  const p110 = [x1, yt1, -hz1], p111 = [x1, yt1,  hz1];
  const pos = [];
  const q = (a, b, c, d) => pos.push(...a, ...b, ...c, ...a, ...c, ...d);
  q(p001, p101, p111, p011); // +Z front
  q(p100, p000, p010, p110); // -Z back
  q(p011, p111, p110, p010); // +Y top
  q(p000, p100, p101, p001); // -Y bottom
  if (capLeft)  q(p000, p001, p011, p010); // -X left cap
  if (capRight) q(p101, p100, p110, p111); // +X right cap
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return prepPartGeo(g, 'x', seed);
}

// Smooth Z-axis sloped hexahedron slice [zMin..zMax] at lateral center cx (for Song 垂带石 stair cheek stones)
function zLoftSliceAt(cx, widthX, zA, zB, ybA, ybB, ytA, ytB, seed, capA = true, capB = true) {
  const swap = zA > zB;
  const z0 = swap ? zB : zA, z1 = swap ? zA : zB;
  const yb0 = swap ? ybB : ybA, yb1 = swap ? ybA : ybB;
  const yt0 = swap ? ytB : ytA, yt1 = swap ? ytA : ytB;
  const c0 = swap ? capB : capA, c1 = swap ? capA : capB;
  const hx = widthX * 0.5;
  const p000 = [cx - hx, yb0, z0], p001 = [cx + hx, yb0, z0];
  const p010 = [cx - hx, yt0, z0], p011 = [cx + hx, yt0, z0];
  const p100 = [cx - hx, yb1, z1], p101 = [cx + hx, yb1, z1];
  const p110 = [cx - hx, yt1, z1], p111 = [cx + hx, yt1, z1];
  const pos = [];
  // Counter-clockwise outward winding (odd X<->Z permutation relative to loftSliceAt)
  const q = (a, b, c, d) => pos.push(...a, ...c, ...b, ...a, ...d, ...c);
  q(p001, p101, p111, p011); // +X outer cheek
  q(p100, p000, p010, p110); // -X inner cheek
  q(p010, p011, p111, p110); // +Y sloped ramp top
  q(p001, p000, p100, p101); // -Y stepped plinth seat
  if (c0) q(p000, p001, p011, p010); // -Z cap
  if (c1) q(p101, p100, p110, p111); // +Z cap
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return prepPartGeo(g, 'z', seed);
}

function buildGongGeo({
  length = 0.72, leftLen = null, rightLen = null, height = 0.17, thick = 0.108,
  notchMode = 'top', notchW = 0.112, topSeatX = null, topSeatH = null,
  tenonXs = [-0.30, 0.30], tenonPinSize = 0.044, tenonPinH = 0.026, seed = 2.0
}) {
  const parts = [];
  const lArm = leftLen !== null ? leftLen : length * 0.5;
  const rArm = rightLen !== null ? rightLen : length * 0.5;
  const halfN = notchW * 0.5;
  const flatL = Math.max(halfN + 0.028, Math.min(0.145, lArm * 0.44));
  const flatR = Math.max(halfN + 0.028, Math.min(0.145, rArm * 0.46));

  const juanshaBot = (x) => {
    if (x < 0) {
      const ax = -x;
      if (ax <= flatL) return 0.0;
      const u = Math.min(1.0, (ax - flatL) / Math.max(0.02, lArm - flatL));
      return height * 0.46 * Math.pow(u, 1.72);
    }
    if (x <= flatR) return 0.0;
    const u = Math.min(1.0, (x - flatR) / Math.max(0.02, rArm - flatR));
    return height * 0.46 * Math.pow(u, 1.72);
  };

  const armTopY = (x) => {
    if (topSeatX !== null && topSeatH !== null && x >= topSeatX[0] - 1e-6 && x <= topSeatX[1] + 1e-6) {
      return topSeatH;
    }
    return height;
  };

  const buildArmSpan = (xStart, xEnd, topYVal, slices, capStart, capEnd) => {
    for (let i = 0; i < slices; i++) {
      const x0 = xStart + ((xEnd - xStart) * i) / slices;
      const x1 = xStart + ((xEnd - xStart) * (i + 1)) / slices;
      parts.push(loftSliceAt(
        x0, x1, juanshaBot(x0), juanshaBot(x1), topYVal, topYVal,
        thick, thick, seed, i === 0 ? capStart : false, i === slices - 1 ? capEnd : false
      ));
    }
  };

  // Left arm [-lArm .. -halfN] split cleanly at exact topSeatX[0] shoulder if present
  if (topSeatX !== null && topSeatH !== null && topSeatX[0] > -lArm + 0.006 && topSeatX[0] < -halfN - 0.006) {
    buildArmSpan(-lArm, topSeatX[0], height, 3, true, true);
    buildArmSpan(topSeatX[0], -halfN, topSeatH, 4, false, true);
  } else {
    buildArmSpan(-lArm, -halfN, armTopY((-lArm - halfN) * 0.5), 6, true, true);
  }

  // Crisp 90° vertical-walled central mortise saddle [-halfN .. +halfN]
  let cBot = 0.0, cTop = armTopY(0.0);
  if (notchMode === 'top') cTop = height * 0.49;
  else if (notchMode === 'shallowTop') cTop = cTop * 0.68;
  else if (notchMode === 'bottom') cBot = height * 0.51;
  parts.push(loftSliceAt(-halfN, halfN, cBot, cBot, cTop, cTop, thick, thick, seed, true, true));

  // Right arm [+halfN .. +rArm] split cleanly at exact topSeatX[1] shoulder if present
  if (topSeatX !== null && topSeatH !== null && topSeatX[1] > halfN + 0.006 && topSeatX[1] < rArm - 0.006) {
    buildArmSpan(halfN, topSeatX[1], topSeatH, 4, true, false);
    buildArmSpan(topSeatX[1], rArm, height, 3, true, true);
  } else {
    buildArmSpan(halfN, rArm, armTopY((halfN + rArm) * 0.5), 6, true, true);
  }

  for (const tx of tenonXs) {
    const baseY = armTopY(tx);
    parts.push(boxAt(tenonPinSize, tenonPinH, tenonPinSize, tx, baseY + tenonPinH * 0.5, 0, 'y', seed));
  }
  return mergeGeometries(parts, false);
}

function buildShuatouGeo({
  backLen = 0.334, frontLen = 0.855, bevelStart = 0.635,
  height = 0.098, thick = 0.088, tenonX = 0.575, seed = 3.0
}) {
  const parts = [];
  // Rear dovetail lock tenon [-backLen .. -0.215] clearing 第二跳斜华拱 -0.340m rear shoulder wall by 6mm
  const xDove = -0.215;
  parts.push(loftSliceAt(-backLen, xDove, 0.003, 0.003, height * 0.88, height * 0.88, thick * 0.88, thick * 0.62, seed, true, false));
  // Full-flat bearing body [xDove .. bevelStart] carrying 撩檐槫 clearance & 耍头齐心交互斗 at tenonX
  parts.push(loftSliceAt(xDove, bevelStart, 0.0, 0.0, height, height, thick, thick, seed, true, false));
  // Downward central lock tongue [-0.041 .. +0.041] socketing cleanly into 第二跳斜华拱 central mortise (4mm clearance all around)
  parts.push(boxAt(0.082, 0.026, thick * 0.88, 0.0, -0.013, 0, 'x', seed));
  // Smooth Song 批竹耍头 sharp 45° diagonal slice + curved lower chin [bevelStart .. frontLen]
  for (let i = 0; i < 6; i++) {
    const u0 = i / 6, u1 = (i + 1) / 6;
    const x0 = bevelStart + (frontLen - bevelStart) * u0;
    const x1 = bevelStart + (frontLen - bevelStart) * u1;
    const yt0 = height * (1.0 - 0.78 * Math.pow(u0, 1.08));
    const yt1 = height * (1.0 - 0.78 * Math.pow(u1, 1.08));
    const yb0 = height * 0.22 * Math.pow(u0, 1.70);
    const yb1 = height * 0.22 * Math.pow(u1, 1.70);
    parts.push(loftSliceAt(x0, x1, yb0, yb1, yt0, yt1, thick * (1.0 - 0.08 * u0), thick * (1.0 - 0.08 * u1), seed, false, i === 5));
  }
  // Top pin at tenonX (on flat top before bevelStart!) engaging 耍头齐心交互斗 bottom mortise
  parts.push(boxAt(0.040, 0.024, 0.040, tenonX, height + 0.012, 0, 'y', seed));
  return mergeGeometries(parts, false);
}

function buildSuozhuColumnGeo(sxSign, szSign, seed = 5.0) {
  const parts = [];
  const baseR = 0.130, topR = 0.118, shaftH = 2.060, headH = 0.180;
  const colSeed = -Math.abs(seed); // Negative flag selects heartwood column cut in cedar shader

  parts.push(boxAt(0.072, 0.054, 0.072, 0, -0.027, 0, 'y', colSeed));

  const rings = 8;
  for (let i = 0; i < rings; i++) {
    const t0 = i / rings, t1 = (i + 1) / rings;
    const y0 = shaftH * t0, y1 = shaftH * t1;
    const rOf = (t) => (t < 0.62 ? baseR : baseR - (baseR - topR) * Math.pow((t - 0.62) / 0.38, 1.55));
    const cyl = new THREE.CylinderGeometry(rOf(t1), rOf(t0), y1 - y0, 20, 1);
    cyl.translate(0, (y0 + y1) * 0.5, 0);
    parts.push(prepPartGeo(cyl, 'y', colSeed));
  }

  // Exact 112mm cruciform column-head mortise slot (accommodates 110mm Lan'e with 1mm fit clearance per side)
  const slotHalf = 0.056;
  const cheekW = 0.048;
  const cheekCenter = slotHalf + cheekW * 0.5;
  for (const qx of [-1, 1]) {
    for (const qz of [-1, 1]) {
      parts.push(boxAt(cheekW, headH, cheekW, qx * cheekCenter, shaftH + headH * 0.5, qz * cheekCenter, 'y', colSeed));
    }
  }
  // Outer blind plugs sealing exterior faces of column head beyond dovetail tenon tips
  parts.push(boxAt(0.034, headH, slotHalf * 1.96, sxSign * (topR - 0.019), shaftH + headH * 0.5, 0, 'y', colSeed));
  parts.push(boxAt(slotHalf * 1.96, headH, 0.034, 0, shaftH + headH * 0.5, szSign * (topR - 0.019), 'y', colSeed));

  // Continuous heartwood 馒头榫 core extending from solid shaft (2.060m) through column head up to 2.402m (zero floating core!)
  const mantou = new THREE.CylinderGeometry(0.042, 0.050, headH + 0.162, 4, 1);
  mantou.rotateY(Math.PI * 0.25);
  mantou.translate(0, shaftH + (headH + 0.162) * 0.5, 0);
  parts.push(prepPartGeo(mantou, 'y', colSeed));
  return mergeGeometries(parts, false);
}

function eaveOutwardExtent(absS) {
  return 2.120 + 0.220 * Math.pow(Math.min(1.0, absS), 2.15);
}

function roofSurfaceY(x, z) {
  const ax = Math.abs(x), az = Math.abs(z);
  const p = Math.max(ax, az), q = Math.min(ax, az);
  const s = p > 1e-4 ? q / p : 0.0;
  const u = p / 2.120;
  const sagF = 1.42 * u - 0.42 * Math.pow(Math.max(u, 0.0), 1.85);
  const yBase = 4.960 - 1.540 * sagF;
  const liftProgress = Math.max(0.0, (p - 0.680) / (2.340 - 0.680));
  const yLift = 0.520 * Math.pow(liftProgress, 2.10) * Math.pow(s, 2.15);
  return yBase + yLift;
}

// L9: Purlins + Song 生头木, Taipingliang & Central Leigongzhu (11 meshes — strictly calibrated beneath Juzhe rafters, corner beams & sheathing)
{
  const buildPurlinGeo = (span, h, w, topLap, withShengtou, seed) => {
    const lapLen = w + 0.004;
    const inner = span - lapLen * 2.0;
    const p = [boxAt(inner, h, w, 0, h * 0.5, 0, 'x', seed)];
    const lapH = h * 0.48;
    const lapY = topLap ? (h - lapH * 0.5) : (lapH * 0.5);
    p.push(boxAt(lapLen, lapH, w, -(inner * 0.5 + lapLen * 0.5), lapY, 0, 'x', seed));
    p.push(boxAt(lapLen, lapH, w,  (inner * 0.5 + lapLen * 0.5), lapY, 0, 'x', seed));

    if (withShengtou) {
      // Authentic Song 生头木 curved eave-riser strip across [-1.38..+1.38] supporting upturned outer 圆椽 with uniform 3mm fit

        const x0 = -stHalf + (2.0 * stHalf * i) / stSegs;
        const x1 = -stHalf + (2.0 * stHalf * (i + 1)) / stSegs;
        const yt0 = Math.max(h + 0.004, (roofSurfaceY(x0, 1.620) - 0.129) - 3.491);
        const yt1 = Math.max(h + 0.004, (roofSurfaceY(x1, 1.620) - 0.129) - 3.491);
        p.push(loftSliceAt(x0, x1, h, h, yt0, yt1, w * 0.80, w * 0.80, seed, i === 0, i === stSegs - 1));
      }
    }
    return mergeGeometries(p, false);
  };

  // 撩檐槫 + 生头木: seated flush in L8 令拱散斗 troughs at y = 3.491..3.559 m (w = 0.092 m < slotW = 0.098 m)

    boxAt(lgM, 0.034, lgCheek, 0, 0.017, -(lgM + lgCheek) * 0.5, 'y', -225),
    boxAt(lgM, 0.034, lgCheek, 0, 0.017,  (lgM + lgCheek) * 0.5, 'y', -225),
    prepPartGeo(new THREE.CylinderGeometry(0.068, 0.082, 0.846, 12).translate(0, 0.457, 0), 'y', -225),
    boxAt(0.050, 0.050, 0.050, 0, 0.905, 0, 'y', -225)
  ];
  registerPart({

// L10: Smooth Lofted Upturned Corner Beams (老角梁 × 4 + 子角梁 × 4 = 8 meshes — zero purlin/dou/sheathing collision)
CORNERS.forEach((c, idx) => {
  const diagRotY = Math.atan2(-c.sz, c.sx);
  const smoothstep = (e0, e1, x) => {
    const t = Math.max(0.0, Math.min(1.0, (x - e0) / (e1 - e0)));
    return t * t * (3.0 - 2.0 * t);
  };

  // Evaluate minimum 望板 soffit across the beam's full lateral width ±halfW so off-diagonal corners never pierce L12!
  const minSheathBotAtR = (r, halfW) => {
    const pDiag = r * Math.SQRT1_2;
    const pEdge = (r + halfW) * Math.SQRT1_2;
    const qEdge = Math.abs(r - halfW) * Math.SQRT1_2;
    return Math.min(roofSurfaceY(pDiag, pDiag), roofSurfaceY(pEdge, qEdge)) - 0.024;
  };

  const fullTopAtR = (r) => minSheathBotAtR(r, 0.047) - 0.008;
  const laojiaoBotAtR = (r) => {
    const tailBot = Math.max(4.049, fullTopAtR(r) - 0.068); // >= 4.049 m (+4mm above 平槫 top 4.045m)
    const seatBot = 3.580; // +2mm flush in 耍头齐心交互斗 trough (3.578m) & +17mm above 撩檐槫 corner (3.563m)
    return tailBot + (seatBot - tailBot) * smoothstep(1.38, 2.08, r);
  };
  const scarfMidAtR = (r) => 0.5 * (laojiaoBotAtR(r) + fullTopAtR(r));

  const buildSpan = (rA, rB, segs, botFn, topFn, thick, capStart, capEnd, seed) => {
    const arr = [];
    for (let i = 0; i < segs; i++) {
      const r0 = rA + ((rB - rA) * i) / segs;
      const r1 = rA + ((rB - rA) * (i + 1)) / segs;
      arr.push(loftSliceAt(
        r0, r1, botFn(r0), botFn(r1), topFn(r0), topFn(r1),
        thick, thick, seed, i === 0 ? capStart : false, i === segs - 1 ? capEnd : false
      ));
    }
    return arr;
  };

  const laoParts = [
    ...buildSpan(1.180, 2.180, 10, laojiaoBotAtR, fullTopAtR, 0.090, true, true, 240 + idx),
    ...buildSpan(2.180, 2.580, 5, laojiaoBotAtR, (r) => scarfMidAtR(r) - 0.002, 0.090, false, true, 240 + idx)
  ];

  const ziCantileverBot = (r) => {
    const b0 = scarfMidAtR(2.584) + 0.002;
    const bTip = fullTopAtR(3.240) - 0.072;
    return b0 + (bTip - b0) * Math.pow(Math.max(0.0, (r - 2.584) / (3.240 - 2.584)), 1.35);
  };
  const ziParts = [
    ...buildSpan(2.184, 2.584, 5, (r) => scarfMidAtR(r) + 0.002, fullTopAtR, 0.086, true, true, 250 + idx),
    ...buildSpan(2.584, 3.240, 8, ziCantileverBot, fullTopAtR, 0.086, false, true, 250 + idx)
  ];

  registerPart({
    geo: mergeGeometries(laoParts, false),
    name: `${c.label}翼角 · 老角梁（大角梁）`, role: '第十层 · 翼角主承重斜梁（尾搭平槫、中越撩檐槫、前坐交互斗，上开阶梯搭交槽）',
    layer: 10, rotY: diagRotY, explodeVec: new THREE.Vector3(0, 3.58, 0),
    matType: 'wood', dimsMm: '1400 × 90 × 215 mm'
  });

  registerPart({
    geo: mergeGeometries(ziParts, false),
    name: `${c.label}翼角 · 子角梁`, role: '第十层 · 反宇起翘飞角梁（与老角梁阶梯刻半咬合，昂首挑出飞檐四角）',
    layer: 10, rotY: diagRotY, explodeVec: new THREE.Vector3(c.sx * 0.24, 3.82, c.sz * 0.24),
    matType: 'wood', dimsMm: '1056 × 86 × 125 mm'
  });
});

// L11: Rafters & Flying Rafters (圆椽 × 20 + 飞椽 × 20 = 40 meshes — zero purlin/sheathing/self collision)
{
  const slopeDefs = [
    { name: '南坡', rotY: 0 },
    { name: '东坡', rotY: Math.PI * 0.5 },
    { name: '北坡', rotY: Math.PI },
    { name: '西坡', rotY: -Math.PI * 0.5 }
  ];
  const groupLateralCenters = [-0.68, -0.34, 0.0, 0.34, 0.68];
  const smoothDip = (p) => {
    const t = Math.max(0.0, Math.min(1.0, (p - 1.32) / 0.16));
    return 0.036 * t * t * (3.0 - 2.0 * t);
  };

  slopeDefs.forEach((sl, sIdx) => {
    groupLateralCenters.forEach((sCenter, gIdx) => {
      const chuanParts = [], feiParts = [];
      for (const sub of [-0.095, 0.0, 0.095]) {
        const sRatio = Math.max(-0.78, Math.min(0.78, sCenter + sub));
        const pEave = eaveOutwardExtent(Math.abs(sRatio));
        const pInner = 0.56, pMid = 1.63;

        for (let k = 0; k < 6; k++) {
          const p0 = pInner + ((pMid - pInner) * k) / 6;
          const p1 = pInner + ((pMid - pInner) * (k + 1)) / 6;
          const pm = (p0 + p1) * 0.5;
          const x0 = sRatio * p0, x1 = sRatio * p1, xm = sRatio * pm;
          const y0 = roofSurfaceY(x0, p0) - 0.062 - smoothDip(p0);
          const y1 = roofSurfaceY(x1, p1) - 0.062 - smoothDip(p1);
          const v0 = new THREE.Vector3(x0, y0, p0), v1 = new THREE.Vector3(x1, y1, p1);
          const cyl = new THREE.CylinderGeometry(0.018, 0.019, v0.distanceTo(v1) * 0.994, 8);
          cyl.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), v1.clone().sub(v0).normalize()));
          cyl.translate(xm, (y0 + y1) * 0.5, pm);
          chuanParts.push(prepPartGeo(cyl, 'z', 300 + sIdx * 10 + gIdx));
        }

        const pFly0 = 1.51, pFly1 = pEave - 0.048;
        for (let k = 0; k < 6; k++) {
          const p0 = pFly0 + ((pFly1 - pFly0) * k) / 6;
          const p1 = pFly0 + ((pFly1 - pFly0) * (k + 1)) / 6;
          const pm = (p0 + p1) * 0.5;
          const x0 = sRatio * p0, x1 = sRatio * p1, xm = sRatio * pm;
          const y0 = roofSurfaceY(x0, p0) - 0.056, y1 = roofSurfaceY(x1, p1) - 0.056;
          const v0 = new THREE.Vector3(x0, y0, p0), v1 = new THREE.Vector3(x1, y1, p1);
          const box = new THREE.BoxGeometry(0.032, v0.distanceTo(v1) * 0.994, 0.022);
          box.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), v1.clone().sub(v0).normalize()));
          box.translate(xm, (y0 + y1) * 0.5, pm);
          feiParts.push(prepPartGeo(box, 'z', 350 + sIdx * 10 + gIdx));
        }
      }

      const latWorld = new THREE.Vector3(sCenter * 0.14, 0, 0.22).applyAxisAngle(new THREE.Vector3(0, 1, 0), sl.rotY);
      registerPart({
        geo: mergeGeometries(chuanParts, false),
        name: `${sl.name} · 第${gIdx + 1}组檐部圆椽`, role: '第十一层 · 顺举折曲线铺设圆椽（尾搭平槫，首压撩檐槫生头木）',
        layer: 11, rotY: sl.rotY, explodeVec: new THREE.Vector3(latWorld.x, 4.92, latWorld.z), matType: 'wood'
      });

      const flyWorld = new THREE.Vector3(sCenter * 0.20, 0, 0.38).applyAxisAngle(new THREE.Vector3(0, 1, 0), sl.rotY);
      registerPart({
        geo: mergeGeometries(feiParts, false),
        name: `${sl.name} · 第${gIdx + 1}组翼角飞椽`, role: '第十一层 · 方截面反宇飞子（叠压圆椽首挑出深远飞檐）',
        layer: 11, rotY: sl.rotY, explodeVec: new THREE.Vector3(flyWorld.x, 5.24, flyWorld.z), matType: 'wood'
      });
    });
  });
}

// L12: Curved Sheathing, Glazed Barrel/Pan Tiles + Wadang/Dishui, Hip Ridges & Finial (29 watertight non-intersecting meshes)
{
  const slopeDefs = [
    { name: '南坡', rotY: 0 },
    { name: '东坡', rotY: Math.PI * 0.5 },
    { name: '北坡', rotY: Math.PI },
    { name: '西坡', rotY: -Math.PI * 0.5 }
  ];

  function buildCurvedSheathingGeo(s0, s1, uSteps, sSteps, yOffBot, yOffTop, seed) {
    const positions = [];
    const pt = (s, u, dy) => {
      const pMax = eaveOutwardExtent(Math.abs(s));
      const p = u * pMax, x = s * p;
      return [x, roofSurfaceY(x, p) + dy, p];
    };
    const pushQuad = (a, b, c, d) => { positions.push(...a, ...b, ...c, ...a, ...c, ...d); };

    for (let iu = 0; iu < uSteps; iu++) {
      const u0 = 0.06 + (0.94 * iu) / uSteps, u1 = 0.06 + (0.94 * (iu + 1)) / uSteps;
      for (let is = 0; is < sSteps; is++) {
        const sa = s0 + ((s1 - s0) * is) / sSteps, sb = s0 + ((s1 - s0) * (is + 1)) / sSteps;
        const t00 = pt(sa, u0, yOffTop), t10 = pt(sb, u0, yOffTop);
        const t11 = pt(sb, u1, yOffTop), t01 = pt(sa, u1, yOffTop);
        const b00 = pt(sa, u0, yOffBot), b10 = pt(sb, u0, yOffBot);
        const b11 = pt(sb, u1, yOffBot), b01 = pt(sa, u1, yOffBot);
        pushQuad(t00, t01, t11, t10);
        pushQuad(b00, b10, b11, b01);
        if (iu === 0) pushQuad(t10, b10, b00, t00);
        if (iu === uSteps - 1) pushQuad(t01, b01, b11, t11);
        if (is === 0) pushQuad(t00, b00, b01, t01);
        if (is === sSteps - 1) pushQuad(t11, b11, b10, t10);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    g.computeVertexNormals();
    return prepPartGeo(g, 'z', seed);
  }

  function buildTileSectorGeo(s0, s1, seed) {
    // Same uSteps=14 piecewise surface + 8mm mortar bed gap above 望板 (0.000m) -> 0 self-penetration!
    const parts = [buildCurvedSheathingGeo(s0, s1, 14, 6, 0.008, 0.024, seed)];
    const numRibs = 3;
    for (let r = 0; r < numRibs; r++) {
      const sRib = s0 + ((s1 - s0) * (r + 0.5)) / numRibs;
      const pMax = eaveOutwardExtent(Math.abs(sRib)) - 0.008;
      // Authentic 攒尖瓦垄交戗 & strict sector containment: barrel ribs never overhang sector seams or hip ridges!
      const hipStart = 0.096 / Math.max(0.05, (1.0 - Math.abs(sRib)) * Math.SQRT1_2);
      const secStart = 0.032 / Math.max(0.02, Math.min(sRib - s0, s1 - sRib));

  // Procedural grounded Song Dynasty garden scholar rocks (湖石坡脚叠石, craggy weathered limestone, anchored below y = 0.000 m)
  function buildScholarRockGeo(rx, ry, rz, px, pz, seed) {
    const indexedGeo = new THREE.SphereGeometry(1.0, 28, 20);
    const pos = indexedGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      let vx = pos.getX(i), vy = pos.getY(i), vz = pos.getZ(i);
      const strata = Math.sin(vy * 7.5 + vx * 2.2 + seed) * 0.08;
      const crag1 = (1.0 - Math.abs(Math.sin(vx * 2.9 + vz * 2.4 + seed * 1.7))) * 0.22;
      const crag2 = Math.cos(vx * 5.4 - vz * 4.8 + seed * 2.3) * 0.10;
      const disp = 0.88 + crag1 + crag2 + strata;
      vx *= rx * disp;
      vz *= rz * disp;
      const normY = vy * 0.5 + 0.5;
      vy = -0.040 + Math.pow(Math.max(0.0, normY), 0.88) * ry * (0.84 + crag1 * 0.55);
      pos.setXYZ(i, vx + px, vy, vz + pz);
    }
    indexedGeo.computeVertexNormals();
    const nonIdx = indexedGeo.toNonIndexed();
    indexedGeo.dispose();
    return prepPartGeo(nonIdx, 'x', 720 + seed);
  }

  const tagBambooPart = (geo, culmSeed, hCulm, baseYOffset, flutterMode) => {
    const nonIdx = geo.index ? geo.toNonIndexed() : geo;
    if (nonIdx !== geo) geo.dispose();
    if (!nonIdx.attributes.normal) nonIdx.computeVertexNormals();
    const pos = nonIdx.attributes.position;
    const swayArr = new Float32Array(pos.count * 4);
    for (let k = 0; k < pos.count; k++) {
      const wy = pos.getY(k);
      const elev = Math.max(0.0, Math.min(1.15, (wy - baseYOffset) / hCulm));
      swayArr[k * 4 + 0] = culmSeed;
      swayArr[k * 4 + 1] = elev;
      swayArr[k * 4 + 2] = flutterMode;
      swayArr[k * 4 + 3] = pos.getX(k) * 3.1 + pos.getZ(k) * 2.7;

    nonIdx.setAttribute('aBambooSway', new THREE.BufferAttribute(swayArr, 4));

  // Authentic 3-blade Song 个字竹叶 spray radiating from petiole origin (0,0,0) with graceful rain-droop arch
  function createThreeBladeSprayTemplate() {
    const verts = [], flutterW = [];
    const bladeSpecs = [
      { yaw:  0.00, len: 0.30, w: 0.024, droop: -0.055 },
      { yaw:  0.48, len: 0.25, w: 0.021, droop: -0.042 },
      { yaw: -0.48, len: 0.24, w: 0.021, droop: -0.045 }
    ];
    for (const bl of bladeSpecs) {
      const cy = Math.cos(bl.yaw), sy = Math.sin(bl.yaw);
      const rot = (lx, ly, lz) => [lx * cy + lz * sy, ly, -lx * sy + lz * cy];
      const p0 = rot(0.0, 0.0, 0.0);
      const pL = rot(-bl.w, 0.006, bl.len * 0.36);
      const pR = rot( bl.w, 0.006, bl.len * 0.36);
      const pT = rot(0.0, bl.droop, bl.len);
      verts.push(...p0, ...pR, ...pT, ...p0, ...pT, ...pL);
      flutterW.push(0.0, 0.38, 1.0, 0.0, 1.0, 0.38);
    }
    return { verts, flutterW };
  }
